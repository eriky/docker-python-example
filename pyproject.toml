[project]
name = "my-webservice"
version = "0.1.0"
description = "A small Flask web service in a Docker image, with tests and a CI/CD pipeline"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
